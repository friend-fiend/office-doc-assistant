# =====================================================================
#  仅 macOS —— 出两份 DMG 挂到 Release（Windows 包本地已有，不再跑 CI）
#
#  触发方式
#  --------
#    推一个 v*-mac* 标签（如 v1.0.6-mac）自动构建并发布；
#    或 Actions 页面 -> Run workflow（仅构建，不发布）。
#
#  产物（2 份）
#  -----------
#    OfficeDocAssistant-<v>-macOS-arm64.dmg      Apple Silicon (M1/M2/M3/M4)
#    OfficeDocAssistant-<v>-macOS-x86_64.dmg     Intel Mac
#
#  构建机只用 macos-15（Apple Silicon）：
#    * macos-13 / macos-14 镜像已于 2026 年退役（macos-14 于 11 月 2 日），
#      用这些标签的任务会被立即取消或永远排队；
#    * x86_64 包在 macos-15 上用 Rosetta 跑 x64 Python 编译，
#      产物为真 Intel 二进制（PyInstaller target_arch=x86_64）。
# =====================================================================
name: macos-dmg

on:
  workflow_dispatch:
  push:
    tags: ["v*-mac*"]

permissions:
  contents: write   # release 步骤需要创建 Release、上传安装包

env:
  # 版本号的权威来源是 build/office_doc_assistant.spec 里的 VERSION，
  # macOS 的 DMG 脚本自己读 spec；此值仅兜底。
  APP_VERSION: "1.0.6"

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - { arch: arm64,  pyarch: arm64 }   # Apple Silicon：原生
          - { arch: x86_64, pyarch: x64 }     # Intel：Rosetta 跑 x64 Python
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11（Intel 包用 x64 版，经 Rosetta 运行）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "${{ matrix.pyarch }}"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0"

      - name: 核心自检
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/selftest.py

      # Intel 包依赖 Rosetta 兼容性，失败时不阻塞 arm64 包发布
      - name: 打包 + DMG
        continue-on-error: ${{ matrix.arch == 'x86_64' }}
        run: |
          chmod +x build/build_macos_dmg.sh
          ./build/build_macos_dmg.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/installer/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
