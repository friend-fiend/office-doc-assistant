# =====================================================================
#  双平台 CI 构建 —— 解决"PyInstaller 不能交叉编译、手上只有一台机器"的问题
#
#  触发方式
#  --------
#    * 手动：Actions 页面 -> Run workflow
#    * 发版：推一个 v* 标签（git tag v1.0.0 && git push --tags），
#      会自动构建并把三份安装包挂到 GitHub Release
#
#  产物（3 份）
#  -----------
#    OfficeDocAssistant-Setup-<v>-win64.exe      Windows 安装包
#    OfficeDocAssistant-<v>-macOS-arm64.dmg      Apple Silicon (M1/M2/M3/M4)
#    OfficeDocAssistant-<v>-macOS-x86_64.dmg     Intel Mac
#
#  秘密（发版签名用，可先不配）
#  --------------------------
#    APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD   macOS 公证
#    WINDOWS_CERT_PFX + WINDOWS_CERT_PASSWORD         Windows 代码签名
# =====================================================================
name: build-installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    tags-ignore: ["v*-mac*"]   # mac 专用标签交给 build-macos-dmg.yml

permissions:/n  contents: write   # release 步骤需要创建 Release、上传安装包

env:
  # 版本号的权威来源是 build/office_doc_assistant.spec 里的 VERSION：
  # Windows 任务会在跑 ISCC 前自动读出来并写回这里，macOS 的 DMG 脚本也自己读 spec。
  # 下面这个值只是"读 spec 失败"时的兜底，正常情况下会被覆盖。
  APP_VERSION: "1.0.6"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11（官方安装版自带 tkinter）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0"

      - name: 核心自检
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/selftest.py

      - name: PyInstaller 打包
        env:
          PYTHONIOENCODING: utf-8
        run: python -m PyInstaller build/office_doc_assistant.spec --noconfirm --clean

      - name: 验证冻结产物可用
        run: dist/OfficeDocAssistant/OfficeDocAssistant.exe --check

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 从 spec 读取版本号（单一来源，避免与 iss/bat 走偏）
        shell: bash
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' build/office_doc_assistant.spec | head -1)
          if [ -z "$v" ]; then echo "未能从 spec 读到版本号，沿用 $APP_VERSION"; v="$APP_VERSION"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "本次构建版本号：$v"

      - name: 生成安装包
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION build/installer_win.iss'

      - name: Windows 代码签名（可选，配了秘密才执行）
        if: env.WINDOWS_CERT_PFX != ''
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          $bytes = [Convert]::FromBase64String($env:CERT)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $bytes)
          $installer = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          signtool sign /fd SHA256 /f "$env:RUNNER_TEMP\cert.pfx" `
            /p ${{ secrets.WINDOWS_CERT_PASSWORD }} /tr http://timestamp.digicert.com /td SHA256 `
            $installer.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*.exe

  build-macos:
    strategy:
      matrix:
        include:
          - { runner: macos-15, arch: arm64, pyarch: arm64 }   # Apple Silicon 原生
          - { runner: macos-15, arch: x86_64, pyarch: x64 }    # Intel：Rosetta 跑 x64 Python
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11（Intel 包用 x64 版，经 Rosetta 运行）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "${{ matrix.pyarch }}"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0"

      - name: 核心自检
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/selftest.py

      - name: 打包 + DMG
        run: |
          chmod +x build/build_macos_dmg.sh
          ./build/build_macos_dmg.sh ${{ matrix.arch }}

      - name: 公证（可选，配了秘密才执行）
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG=$(ls dist/installer/*.dmg | head -1)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/installer/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
